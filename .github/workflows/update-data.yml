name: Update RalloPicks Data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 13,17,21 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout RalloPicks
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Update MLB pitch arsenals
        run: python scripts/update_arsenals.py

      - name: Update MLB moneylines
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/update_odds.py

      - name: Save fresh RalloPicks data
        run: |
          git config user.name "rallopicks-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Auto-update MLB data"
          git push
