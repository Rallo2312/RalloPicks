name: Update RalloPicks Data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_arsenals.py"
      - "scripts/update_nfl.py"
      - "scripts/update_hr_odds.py"
      - "scripts/update_pitcher_strikeouts.py"
      - ".github/workflows/update-data.yml"
  schedule:
    - cron: "15 13,17,21 * * *"

permissions:
  contents: write

concurrency:
  group: update-rallopicks-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout RalloPicks
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Validate data scripts
        run: python -m py_compile scripts/*.py

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Update MLB pitch arsenals
        run: python scripts/update_arsenals.py

      - name: Update MLB moneylines
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/update_odds.py

      - name: Update NFL matchups, rankings, and moneylines
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/update_nfl.py

      - name: Update MLB pitcher strikeout board
        id: pitcher_strikeouts
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/update_pitcher_strikeouts.py

      - name: Ensure pitcher strikeout data exists
        if: always()
        run: |
          if [ ! -f data/pitcher-strikeouts.json ]; then
            printf '%s\n' '{"updated_at":null,"season":2026,"rows":[],"status":"generator_failed"}' > data/pitcher-strikeouts.json
          fi

      - name: Update verified MLB home run odds
        env:
          SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
        run: python scripts/update_hr_odds.py


      - name: Save fresh RalloPicks data
        run: |
          git config user.name "rallopicks-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Auto-update MLB and NFL data"
          git push

